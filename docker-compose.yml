services:
  pg:
    image: postgres:17
    container_name: pg
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_DATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: nest-boilerplate:latest
    build:
      context: .
    profiles:
      - api
    container_name: nest-boilerplate-api
    ports:
      - "4001:4001"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      SERVER_PORT: 4001
      DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@pg:5432/${DB_DATABASE}?schema=public
    depends_on:
      pg:
        condition: service_healthy

volumes:
  pgdata:

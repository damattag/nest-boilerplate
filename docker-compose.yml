services:
  api-dev:
    profiles:
      - dev
    build:
      dockerfile: Dev.Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - SERVER_PORT=3001
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: package.json

  pg:
    profiles:
      - dev
    image: postgres:17
    container_name: pg
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_DATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    profiles:
      - prod
    build:
      context: .
    ports:
      - "4001:4001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - SERVER_PORT=4001
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata: